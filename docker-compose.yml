services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idempotency
      POSTGRES_PASSWORD: idempotency
      POSTGRES_DB: idempotency
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idempotency"]
      interval: 2s
      timeout: 2s
      retries: 15
